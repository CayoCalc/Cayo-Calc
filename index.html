<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f7f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{max-width:520px;margin:auto;padding:18px 16px 34px}.head{padding:8px 2px 18px}.eyebrow{font-size:12px;letter-spacing:2px;opacity:.65;font-weight:800}.title{font-size:34px;font-weight:900;line-height:1;margin:5px 0}.sub{opacity:.65;font-size:13px}
.card{background:#151c30;border:1px solid #29324a;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 30px #0003}.section{font-size:12px;letter-spacing:1.4px;font-weight:900;opacity:.7;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.lootname{display:flex;align-items:center;gap:9px;font-weight:800}.emoji{font-size:23px}
.stepper{display:flex;align-items:center;gap:9px}.stepper button{width:38px;height:38px;border:0;border-radius:12px;background:#29324a;color:#fff;font-size:23px}.count{min-width:25px;text-align:center;font-weight:900}
.primary{width:100%;border:0;border-radius:16px;padding:16px;background:#fff;color:#0b1020;font-weight:950;font-size:17px;margin-top:5px}.secondary{width:100%;border:1px solid #39445f;border-radius:14px;padding:12px;background:transparent;color:#fff;font-weight:800;margin-top:10px}
.bags{display:grid;gap:10px}.bag{background:#0e1527;border:1px solid #29324a;border-radius:15px;padding:13px}.bagtop{display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px}.bar{height:9px;background:#29324a;border-radius:9px;overflow:hidden}.fill{height:100%;background:#fff}.item{display:flex;justify-content:space-between;font-size:13px;margin-top:7px}.note{font-size:12px;opacity:.6;line-height:1.45;margin-top:12px}.badge{display:inline-block;padding:5px 8px;border-radius:9px;background:#26304a;font-size:11px;font-weight:900}.empty{text-align:center;opacity:.55;padding:12px}.profit{font-size:25px;font-weight:950;margin:4px 0 12px}.cuts{display:grid;gap:8px;margin-top:8px}.cutrow{display:flex;align-items:center;justify-content:space-between;background:#0e1527;border:1px solid #29324a;border-radius:13px;padding:9px 10px}.cutname{font-weight:850}.cutcontrol{display:flex;align-items:center;gap:8px}.cutcontrol button{width:34px;height:34px;border:0;border-radius:10px;background:#29324a;color:#fff;font-size:20px}.cutpct{min-width:44px;text-align:center;font-weight:950}.cutstatus{font-size:11px;line-height:1.4;margin-top:8px}.valid{color:#9ff0b5}.invalid{color:#ff9f9f}.muted{opacity:.6;font-size:12px}.rule{font-size:11px;opacity:.48;margin-top:3px}.locations{display:grid;gap:8px}.locrow{background:#0e1527;border:1px solid #29324a;border-radius:13px;padding:10px}.loctop{display:flex;justify-content:space-between;align-items:center;font-weight:850}.locselect{margin-top:8px;width:100%;background:#29324a;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:750;cursor:pointer;text-align:left}.pickerOverlay{position:fixed;inset:0;background:rgba(3,6,15,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:22px;z-index:1000}.pickerOverlay.show{display:flex}.picker{width:min(100%,430px);background:#151c30;border:1px solid #39445f;border-radius:22px;box-shadow:0 20px 70px #000b;padding:16px;animation:pickerIn .16s ease-out}.pickerHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 4px 12px}.pickerTitle{font-size:17px;font-weight:950}.pickerClear{border:1px solid #7a3b52;background:#251522;color:#ffb7c9;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:900;white-space:nowrap}.pickerClear:active{transform:scale(.98);background:#3a2030}.pickerSub{font-size:12px;opacity:.6;margin:-6px 4px 12px}.pickerOptions{display:grid;gap:8px}.pickerOption{width:100%;border:1px solid #303b55;background:#0e1527;color:#fff;border-radius:14px;padding:14px;text-align:left;font-size:15px;font-weight:800}.pickerOption:active{transform:scale(.985);background:#29324a}.pickerCancel{width:100%;border:1px solid #39445f;background:transparent;color:#fff;border-radius:14px;padding:12px;margin-top:10px;font-weight:800}.pickerBack{width:100%;border:1px solid #39445f;background:#29324a;color:#fff;border-radius:14px;padding:11px;margin-top:10px;font-weight:850}.addLootCard{margin-top:0}.addLootButton{width:100%;border:1px solid #39445f;border-radius:16px;padding:16px;background:#0e1527;color:#fff;font-weight:950;font-size:17px}.addLootButton:active{transform:scale(.985);background:#29324a}.pickerStep{font-size:10px;letter-spacing:1.5px;font-weight:950;color:#d8b34c;margin:0 4px 7px}.pickerSuccess{font-size:11px;color:#9ff0b5;margin:8px 4px 0;font-weight:800}.pickerOption small{display:block;font-size:11px;opacity:.52;font-weight:700;margin-top:3px}@keyframes pickerIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#171f35 0%,#0e1527 55%,#1a233b 100%);border:1px solid #39445f;border-radius:22px;padding:16px 17px;margin:2px 0 16px;box-shadow:0 12px 34px #0005}<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Righteous&family=Titan+One&display=swap');
.banner{
 position:relative;overflow:hidden;min-height:190px;padding:22px 20px 18px;margin:2px 0 18px;
 border:1px solid #5a5570;border-radius:24px;
 background:
   radial-gradient(circle at 82% 16%,rgba(255,214,77,.30) 0 7%,transparent 28%),
   radial-gradient(circle at 18% 12%,rgba(255,112,42,.30) 0 8%,transparent 30%),
   linear-gradient(180deg,#ff7b38 0%,#f04e45 27%,#6e2c6f 54%,#17375c 72%,#07172a 100%);
 box-shadow:0 16px 42px #0008,inset 0 1px 0 #fff3;
}
.bannerTop{position:relative;z-index:3;display:block}
.bannerBrand{
 font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:10px;letter-spacing:2.5px;line-height:1;color:#fff;opacity:.72;
 text-shadow:2px 2px 0 #250d3e,0 0 14px #8b3dff66;
 transform:rotate(-2deg);transform-origin:left center;margin-left:2px;
}
.bannerTitle{
 font-family:'Righteous',Impact,sans-serif;font-size:48px;letter-spacing:1px;line-height:.95;margin:6px 0 0;
 background:linear-gradient(180deg,#fff5a0 0%,#ffd33d 38%,#ff9d24 72%,#ff6b16 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 -webkit-text-stroke:1px rgba(68,26,7,.55);
 text-shadow:0 5px 0 #7c2b0a,0 8px 18px #0008;
 filter:drop-shadow(0 0 9px #ffbd2e33);
}
.bannerEdition{
 position:relative;z-index:4;margin-top:10px;padding:6px 12px;border-radius:999px;
 background:linear-gradient(90deg,#2c164a,#4c2371);border:1px solid #9c5fd0;
 color:#f3ddff;font-family:'Bangers',Impact,sans-serif;font-size:15px;letter-spacing:2px;
 box-shadow:0 4px 14px #16072088;transform:rotate(-1deg);display:inline-block;
}
.bannerSub{position:relative;z-index:4;margin-top:10px;max-width:380px;font-size:12px;line-height:1.4;color:#fff;opacity:.78;text-shadow:0 2px 5px #0008}
.bannerMark{position:absolute;right:4px;bottom:-3px;z-index:2;font-size:64px;filter:drop-shadow(0 7px 10px #0008);opacity:.95}
.bannerPalm{position:absolute;right:12px;bottom:15px;width:120px;height:115px;z-index:1;opacity:.78;pointer-events:none}
.bannerPalm svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 8px #0008)}
.bannerBirds{position:absolute;right:105px;top:25px;z-index:2;font-size:15px;letter-spacing:5px;opacity:.55;transform:rotate(-8deg)}
.bannerLogoGlow{position:absolute;left:22%;top:30px;width:180px;height:80px;background:#ffd24a22;filter:blur(22px);border-radius:50%;z-index:0}
</style></style>
<style>
.actionStack{display:grid;gap:10px;margin:12px 0}.actionStack .primary{margin-top:0}.actionStack .secondary{margin-top:0}.secondary:active{transform:scale(.985);background:#29324a}
.primary{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}.primary:active{transform:translateY(2px) scale(.985);filter:brightness(1.08);box-shadow:0 0 0 4px rgba(255,255,255,.10),0 8px 22px #0006}.primary.pressed{animation:optPulse .32s ease-out}@keyframes optPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.18)}45%{transform:scale(.985);box-shadow:0 0 0 7px rgba(255,255,255,.10)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.locationGroup{margin-top:10px}.locationGroup:first-child{margin-top:0}.locationHeader{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#0e1527;border:1px solid #29324a;border-radius:14px;padding:12px 13px;font-weight:900}.locationHeader .chev{font-size:18px;opacity:.75}.locationPanel{padding-top:9px}.subhead{font-size:11px;letter-spacing:1.1px;font-weight:900;opacity:.55;margin:8px 2px}.saveHint{font-size:11px;opacity:.45;text-align:center;margin-top:9px}
</style>

<style>
.banner.bannerImage{position:relative;overflow:hidden;width:100%;aspect-ratio:1536/576;margin:2px 0 18px;padding:0;border:1px solid #5a5570;border-radius:24px;background:#0b1020;box-shadow:0 14px 36px #0008}
.banner.bannerImage img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
</style>

<style>
/* ===== ISOLATED MISSION BRIEFING — does not alter the app UI ===== */
.briefingLaunch{display:block;width:100%;border:1px solid #7a3040;border-radius:14px;padding:13px;background:#17131d;color:#fff;font-weight:900;margin-top:10px}
.briefingOverlay{position:fixed;inset:0;z-index:5000;display:none;background:#050812;overflow:auto;padding:10px}
.briefingOverlay.show{display:block}
.briefingShell{position:relative;width:min(100%,760px);min-height:100%;margin:0 auto;background:#0b1020;border:1px solid #343a52;border-radius:18px;overflow:hidden;box-shadow:0 20px 80px #000c}
.briefingControls{position:absolute;top:12px;right:12px;z-index:50;display:flex;flex-direction:column;gap:8px}
.briefingClose,.briefingFullscreen{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid #6a3140;border-radius:50%;background:#160f18;color:#fff;font-weight:900;box-shadow:0 4px 18px #0009}
.briefingClose{font-size:23px;line-height:1}
.briefingFullscreen{font-size:21px;line-height:1}
.briefingPage{background:#0b1020;color:#f7f7fb;padding-bottom:18px}
.briefingBanner{display:block;width:100%;height:auto;margin:0;border:0;border-radius:0;object-fit:initial}
.briefingBody{padding:12px 14px 0}
.briefingStampRow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.briefingStamp{border:2px solid #c52f3d;color:#e64b57;padding:4px 8px;font-size:10px;letter-spacing:1.2px;font-weight:950;transform:rotate(-2deg);opacity:.95}
.briefingStamp:nth-child(2){transform:rotate(1deg)}
.briefingCard{background:#12182a;border:1px solid #343a52;border-radius:14px;padding:11px 13px;margin:9px 0}
.briefingKicker{font-size:10px;letter-spacing:1.6px;font-weight:950;color:#d8b34c;margin-bottom:6px}
.briefingStatus{font-size:20px;font-weight:950;line-height:1.05}
.briefingSub{font-size:11px;opacity:.62;margin-top:5px}.briefingDateTime{margin-top:12px;padding-top:10px;border-top:1px solid #29324a;font-size:13px;line-height:1.45;font-weight:850;letter-spacing:.7px;color:#d9dde8}.briefingDateTime::first-letter{}
.briefingZoneGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.briefingZoneTitle{font-size:12px;font-weight:950;color:#d8b34c;margin-bottom:7px;letter-spacing:.6px}
.briefingLoc{padding:6px 0;border-top:1px solid #293047;font-size:13px;font-weight:850;color:#e84b56}
.briefingLoc:first-child{border-top:0;padding-top:0}
.briefingLocLoot{display:block;color:#fff;font-size:11px;font-weight:700;margin-top:2px;line-height:1.3}
.briefingBagGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.briefingBag{background:#0d1424;border:1px solid #343a52;border-radius:13px;padding:11px 12px}
.briefingBagHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.briefingBagName{font-size:17px;font-weight:950;color:#fff}
.briefingBagPct{font-size:17px;font-weight:950;color:#d8b34c}
.briefingBagItem{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid #252d42;font-size:13px;font-weight:800}
.briefingBagItem:first-child{border-top:0}
.briefingBagItem strong{color:#d8b34c;white-space:nowrap}
.briefingFooter{margin:12px 12px 0;padding-top:10px;border-top:1px solid #343a52;text-align:center;font-size:9px;letter-spacing:1.1px;font-weight:850;opacity:.72;line-height:1.65}

/* True fullscreen: use the whole display and keep the briefing controls over the banner. */
html:fullscreen .briefingOverlay{padding:0;background:#050812}
html:fullscreen .briefingShell{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}
html:fullscreen .briefingPage{padding-bottom:10px}
html:fullscreen .briefingBody{padding:10px 14px 0}
html:fullscreen .briefingCard{margin:7px 0;padding:9px 12px}
html:fullscreen .briefingLoc{padding:5px 0}
html:fullscreen .briefingBag{padding:9px 11px}
html:fullscreen .briefingFooter{margin-top:9px;padding-top:8px}
@media(max-width:560px){.briefingOverlay{padding:0}.briefingShell{border-radius:0;border-left:0;border-right:0}.briefingZoneGrid,.briefingBagGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.briefingBody{padding:10px 10px 0}.briefingStatus{font-size:19px}.briefingCard{padding:10px 11px}.briefingLoc{font-size:12px}.briefingLocLoot{font-size:10px}.briefingBagName,.briefingBagPct{font-size:16px}.briefingBagItem{font-size:12px;padding:4px 0}.briefingFooter{font-size:8px}}
</style>

<script>
const TYPES=[
 {k:'gold',n:'Gold',e:'🥇',space:66.7,value:297750,split:true},
 {k:'painting',n:'Painting',e:'🖼️',space:50,value:151875,split:false},
 {k:'coke',n:'Cocaine',e:'❄️',space:50,value:180225,split:true},
 {k:'weed',n:'Weed',e:'🌿',space:37.5,value:119475,split:true},
 {k:'cash',n:'Cash',e:'💵',space:25,value:72900,split:true}
];
let bags=2;
let mode='normal';
let qty={gold:0,painting:0,coke:0,weed:0,cash:0};
let cuts=[85,15];
const LOCATION_TYPES=['gold','painting','coke','weed','cash'];
const MAIN_LOCATIONS=['Office','Basement','North Storage','South Storage','West Storage'];
const AIRSTRIP_LOCATIONS=['Hangar Bottom Cage','Hangar Top Cage','Storage Shed'];
const SUMMARY_LOCATIONS=[...MAIN_LOCATIONS,...AIRSTRIP_LOCATIONS];
const LOCATION_OPTIONS={
 gold:MAIN_LOCATIONS.filter(x=>x!=='Office'),
 painting:[...MAIN_LOCATIONS],
 coke:[...AIRSTRIP_LOCATIONS],
 weed:[...AIRSTRIP_LOCATIONS],
 cash:[...MAIN_LOCATIONS.filter(x=>x!=='Office'),...AIRSTRIP_LOCATIONS]
};
function isValidLocation(k,loc){ return !!(LOCATION_OPTIONS[k]||[]).includes(loc); }
function sanitizeLocationAssignments(){
  LOCATION_TYPES.forEach(k=>{
    locationAssignments[k]=(locationAssignments[k]||[]).map(loc=>isValidLocation(k,loc)?loc:'');
    syncLocationAssignments(k);
  });
}
const locationAssignments={gold:[],painting:[],coke:[],weed:[],cash:[]};
const LOCATION_STORAGE_KEY='cayoCalcState_v19_dev3';
let locationGroups={main:false,airstrip:false};

function bagsBy(n){
 bags=Math.max(1,Math.min(4,bags+n));
 document.getElementById('bagCount').textContent=bags;
 const defaults={1:[100],2:[85,15],3:[70,15,15],4:[55,15,15,15]};
 cuts=defaults[bags].slice();
 renderCuts();
 saveState();
}
function lootBy(k,n){
 qty[k]=Math.max(0,qty[k]+n);
 const countEl=document.getElementById(k+'Count'); if(countEl) countEl.textContent=qty[k];
 syncLocationAssignments(k);
 renderLocations();
 saveState();
}

function addLootStack(k,loc){
  if(!isValidLocation(k,loc))return;
  qty[k]=Number(qty[k]||0)+1;
  syncLocationAssignments(k);
  locationAssignments[k][qty[k]-1]=loc;
  renderLocations();
  saveState();
}

function saveState(){
 try{
   localStorage.setItem(LOCATION_STORAGE_KEY,JSON.stringify({bags,mode,qty,cuts,locationAssignments,locationGroups}));
 }catch(e){}
}
function loadState(){
 try{
   const raw=localStorage.getItem(LOCATION_STORAGE_KEY);
   if(!raw)return false;
   const st=JSON.parse(raw);
   if(!st||!st.qty)return false;
   bags=Math.max(1,Math.min(4,Number(st.bags)||2));
   mode=st.mode==='hard'?'hard':'normal';
   qty={gold:0,painting:0,coke:0,weed:0,cash:0,...st.qty};
   cuts=Array.isArray(st.cuts)?st.cuts.slice(0,bags).map(Number):[85,15];
   const defaults={1:[100],2:[85,15],3:[70,15,15],4:[55,15,15,15]};
   if(cuts.length!==bags)cuts=defaults[bags].slice();
   LOCATION_TYPES.forEach(k=>{locationAssignments[k]=Array.isArray(st.locationAssignments?.[k])?st.locationAssignments[k].slice(0,qty[k]):[];syncLocationAssignments(k)});
   sanitizeLocationAssignments();
   locationGroups={main:!!st.locationGroups?.main,airstrip:!!st.locationGroups?.airstrip};
   document.getElementById('bagCount').textContent=bags;
   setMode(mode);
   return true;
 }catch(e){return false}
}
function syncLocationAssignments(k){
 if(!LOCATION_TYPES.includes(k)) return;
 while(locationAssignments[k].length<qty[k]) locationAssignments[k].push('');
 if(locationAssignments[k].length>qty[k]) locationAssignments[k].length=qty[k];
}
function toggleLocationGroup(group){
 locationGroups[group]=!locationGroups[group];
 applyLocationGroupUI();
 saveState();
}
function applyLocationGroupUI(){
 ['main','airstrip'].forEach(group=>{
   const p=document.getElementById(group==='main'?'mainLocationPanel':'airstripLocationPanel');
   const c=document.getElementById(group==='main'?'mainLocationChevron':'airstripLocationChevron');
   if(!p||!c)return;
   const open=!!locationGroups[group];
   p.style.display=open?'block':'none';
   c.textContent=open?'−':'＋';
 });
}

let pickerTarget=null;
let addLootStep='location';
let addLootLocation='';
function openAddLoot(){
  addLootStep='location';
  addLootLocation='';
  renderAddLootDialog();
  document.getElementById('locationPickerOverlay').classList.add('show');
  document.body.style.overflow='hidden';
}
function renderAddLootDialog(){
  const title=document.getElementById('pickerTitle');
  const sub=document.getElementById('pickerSub');
  const step=document.getElementById('pickerStep');
  const box=document.getElementById('pickerOptions');
  const back=document.getElementById('pickerBack');
  const success=document.getElementById('pickerSuccess');
  const clearBtn=document.getElementById('pickerClear');
  if(!title||!sub||!step||!box)return;
  if(addLootStep==='location'){
    title.textContent='Add Loot';
    sub.textContent='Choose where you found the loot.';
    step.textContent='STEP 1 OF 2 • LOCATION';
    back.style.display='none';
    if(clearBtn)clearBtn.style.display='none';
    success.style.display='none';
    let html='<div class="pickerStep" style="margin-top:2px">🏝️ MAIN COMPOUND</div>';
    MAIN_LOCATIONS.forEach(loc=>{html+='<button type="button" class="pickerOption" data-picker-action="location" data-location="'+escapeHtml(loc)+'">'+escapeHtml(loc)+'</button>';});
    html+='<div class="pickerStep" style="margin-top:8px">🛩️ AIRSTRIP</div>';
    AIRSTRIP_LOCATIONS.forEach(loc=>{html+='<button type="button" class="pickerOption" data-picker-action="location" data-location="'+escapeHtml(loc)+'">'+escapeHtml(loc)+'</button>';});
    box.innerHTML=html;
  }else{
    title.textContent=addLootLocation;
    sub.textContent='Choose the loot you found here.';
    step.textContent='STEP 2 OF 2 • LOOT';
    back.style.display='block';
    if(clearBtn)clearBtn.style.display='inline-block';
    success.style.display='none';
    const valid=LOCATION_TYPES.filter(k=>isValidLocation(k,addLootLocation));
    box.innerHTML=valid.map(k=>{
      const t=TYPES.find(x=>x.k===k);
      const count=(locationAssignments[k]||[]).filter(loc=>loc===addLootLocation).length;
      return '<button type="button" class="pickerOption" data-picker-action="loot" data-loot="'+escapeHtml(k)+'">'+t.e+' '+escapeHtml(t.n)+'<small>'+t.space+'% bag space • '+count+' added here</small></button>';
    }).join('');
  }
}
function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[ch]));
}

function initLootPickerEvents(){
  const box=document.getElementById('pickerOptions');
  if(!box||box.dataset.bound==='1')return;
  box.dataset.bound='1';
  box.addEventListener('click',event=>{
    const btn=event.target.closest('.pickerOption');
    if(!btn||!box.contains(btn))return;
    event.preventDefault();
    event.stopPropagation();
    if(btn.dataset.pickerAction==='location'){
      selectAddLootLocation(btn.dataset.location||'');
    }else if(btn.dataset.pickerAction==='loot'){
      selectAddLoot(btn.dataset.loot||'');
    }
  });
}

function selectAddLootLocation(loc){
  addLootLocation=loc;
  addLootStep='loot';
  renderAddLootDialog();
}
function selectAddLoot(k){
  if(!addLootLocation)return;
  const t=TYPES.find(x=>x.k===k);
  addLootStack(k,addLootLocation);
  const msg='✓ Added '+t.n+' to '+addLootLocation;
  const success=document.getElementById('pickerSuccess');
  if(success){success.textContent=msg;success.style.display='block';}
  renderAddLootDialog();
  // Re-display the success message after the dialog render.
  if(success){success.textContent=msg;success.style.display='block';}
}
function addLootBack(){
  addLootStep='location';
  addLootLocation='';
  renderAddLootDialog();
}
function clearCurrentLocation(){
  if(!addLootLocation)return;
  const loc=addLootLocation;
  LOCATION_TYPES.forEach(k=>{
    const arr=locationAssignments[k]||[];
    const remaining=arr.filter(assigned=>assigned!==loc);
    locationAssignments[k]=remaining;
    qty[k]=remaining.length;
    syncLocationAssignments(k);
  });
  renderLocations();
  saveState();
  const success=document.getElementById('pickerSuccess');
  if(success){success.textContent='✓ Cleared all loot from '+loc;success.style.display='block';}
  renderAddLootDialog();
  if(success){success.textContent='✓ Cleared all loot from '+loc;success.style.display='block';}
}
function openLocationPicker(k,i){
  // Legacy location picker retained only for saved-state compatibility; the new
  // entry flow records loot and location together, so normal users never need it.
  pickerTarget={k,i};
  const t=TYPES.find(x=>x.k===k);
  const current=locationAssignments[k][i]||'';
  document.getElementById('pickerTitle').textContent=t.e+' '+t.n+' '+(i+1);
  document.getElementById('pickerSub').textContent=current?'Current location: '+current:'Choose where this loot is located.';
  document.getElementById('pickerStep').textContent='EDIT SAVED LOCATION';
  document.getElementById('pickerBack').style.display='none';
  document.getElementById('pickerSuccess').style.display='none';
  const box=document.getElementById('pickerOptions');
  box.innerHTML=(LOCATION_OPTIONS[k]||[]).map(loc=>'<button type="button" class="pickerOption" onclick="chooseLocation('+JSON.stringify(loc)+')">'+loc+(current===loc?' ✓':'')+'</button>').join('');
  document.getElementById('locationPickerOverlay').classList.add('show');
  document.body.style.overflow='hidden';
}

/*
 Each stack is modeled at 0.1% bag-space resolution.
 Splittable loot may be taken fractionally.
 Paintings are indivisible 50% stacks: they are either 0% or 50%.
 Objective: maximize secondary-loot value.
*/
function optimize(){
 const btn=document.querySelector('.primary');
 if(btn){btn.classList.remove('pressed');void btn.offsetWidth;btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),350);}
 if(!cutsValid()){
   document.getElementById('result').innerHTML='<div class="empty">⚠️ Your player cuts must add up to <b>100%</b>, using 5% increments and at least 15% per player.</div>';
   return;
 }

 /*
  * Cayo route-aware optimization:
  * Airstrip loot is collected first. With 2+ players, every Airstrip stack is indivisible; with 1 player, Airstrip split loot may remain fractional.
  * Compound Gold/Cash may fill remaining capacity fractionally; Paintings remain indivisible.
  *
  * Location assignments are therefore part of the optimization input.
  */
 const airstripStacks=[];
 const compoundStacks=[];
 const unassigned=[];

 LOCATION_TYPES.forEach(k=>{
   const t=TYPES.find(x=>x.k===k);
   for(let i=0;i<qty[k];i++){
     const loc=locationAssignments[k]?.[i]||'';
     const stack={t,index:i,location:loc};
     if(AIRSTRIP_LOCATIONS.includes(loc)) airstripStacks.push(stack);
     else if(MAIN_LOCATIONS.includes(loc)) compoundStacks.push(stack);
     else unassigned.push(stack);
   }
 });

 if(unassigned.length){
   document.getElementById('result').innerHTML='<div class="empty">📍 Assign every loot stack to its location first, then hit <b>Optimize Loot</b>. Cayo Calc now respects the Airstrip → Main Compound route, so it needs to know which stacks are at the Airstrip.</div>';
   return;
 }

 const cap=Math.round(bags*1000);

 /*
  * Player-count route rules:
  * - SOLO: use Airstrip loot only. Compound loot is ignored for this run.
  * - 2+ PLAYERS: use Compound loot first. Airstrip loot is allowed only when
  *   the available Compound loot cannot fill all bags.
  *
  * We decide this from available Compound bag-space before optimizing value.
  * If Compound can fill every bag, Airstrip is excluded entirely. If it cannot,
  * Airstrip becomes eligible and the highest-value rule applies across both areas.
  */
 const airstripFixed=(bags>1);
 let useAirstrip=false;
 if(bags===1){
   useAirstrip=true;
 }else{
   const compoundCapacity=compoundStacks.reduce((sum,p)=>sum+p.t.space,0);
   useAirstrip=compoundCapacity+0.001<bags*100;
 }

 const activeAirstripStacks=useAirstrip?airstripStacks:[];
 const activeCompoundStacks=bags===1?[]:compoundStacks;

 let airDP=Array(cap+1).fill(null);
 airDP[0]={v:0,parts:[]};
 for(const p of activeAirstripStacks){
   const units=Math.round(p.t.space*10);
   const next=airDP.map(x=>x?{v:x.v,parts:x.parts.slice()}:null);
   for(let c=0;c<=cap;c++){
     if(!airDP[c])continue;
     if(airstripFixed){
       if(c+units>cap)continue;
       const nv=airDP[c].v+p.t.value;
       if(!next[c+units] || nv>next[c+units].v+0.001){
         next[c+units]={v:nv,parts:airDP[c].parts.concat([{t:p.t,space:p.t.space,index:p.index,location:p.location,phase:'airstrip'}])};
       }
     }else if(p.t.split){
       for(let take=1;take<=units && c+take<=cap;take++){
         const frac=take/units;
         const nv=airDP[c].v+p.t.value*frac;
         if(!next[c+take] || nv>next[c+take].v+0.001){
           next[c+take]={v:nv,parts:airDP[c].parts.concat([{t:p.t,space:take/10,index:p.index,location:p.location,phase:'airstrip'}])};
         }
       }
     }else if(c+units<=cap){
       const nv=airDP[c].v+p.t.value;
       if(!next[c+units] || nv>next[c+units].v+0.001){
         next[c+units]={v:nv,parts:airDP[c].parts.concat([{t:p.t,space:p.t.space,index:p.index,location:p.location,phase:'airstrip'}])};
       }
     }
   }
   airDP=next;
 }

 // Phase 2: for every possible whole-Airstrip selection, fill the remaining
 // capacity with the best possible Compound combination. Compound Paintings
 // are whole-only; Gold/Cash are splittable.
 let best=null;
 for(let airUsed=0;airUsed<=cap;airUsed++){
   const airState=airDP[airUsed];
   if(!airState)continue;
   const remaining=cap-airUsed;
   let dp=Array(remaining+1).fill(null);
   dp[0]={v:0,parts:[]};

   for(const p of activeCompoundStacks){
     const t=p.t;
     const units=Math.round(t.space*10);
     const next=dp.map(x=>x?{v:x.v,parts:x.parts.slice()}:null);
     for(let c=0;c<=remaining;c++){
       if(!dp[c])continue;
       if(t.split){
         for(let take=1;take<=units && c+take<=remaining;take++){
           const frac=take/units;
           const nv=dp[c].v+t.value*frac;
           if(!next[c+take] || nv>next[c+take].v+0.001){
             next[c+take]={v:nv,parts:dp[c].parts.concat([{t:t,space:take/10,index:p.index,location:p.location,phase:'compound'}])};
           }
         }
       }else if(c+units<=remaining){
         const nv=dp[c].v+t.value;
         if(!next[c+units] || nv>next[c+units].v+0.001){
           next[c+units]={v:nv,parts:dp[c].parts.concat([{t:t,space:t.space,index:p.index,location:p.location,phase:'compound'}])};
         }
       }
     }
     dp=next;
   }

   for(let c=0;c<=remaining;c++){
     if(!dp[c])continue;
     const totalValue=airState.v+dp[c].v;
     const compoundUsed=c;
     /*
      * When 2+ players need Airstrip loot, Compound space is the priority: we
      * maximize how much of the available bag capacity is filled by Compound
      * loot before using Airstrip loot to cover the shortfall. Value breaks
      * ties between equally full Compound selections. Solo runs simply maximize
      * Airstrip value because Compound loot is excluded above.
      */
     /*
      * Once Airstrip loot is eligible (because Compound capacity is insufficient),
      * the normal highest-value rule takes over across all eligible loot.
      * Compound loot is NOT given a value-priority override: Airstrip cocaine,
      * for example, can beat lower-value Compound weed when both are eligible.
      * The route gate above is the only thing that decides whether Airstrip may
      * participate at all.
      */
     const better = !best || totalValue>best.v+0.001;
     if(better){
       best={v:totalValue,compoundUsed,parts:airState.parts.concat(dp[c].parts)};
     }
   }
 }

 if(!best){
   document.getElementById('result').innerHTML='<div class="empty">Add some loot first.</div>';
   return;
 }

 const out=Array.from({length:bags},()=>({used:0,items:[]}));

 // Allocate Airstrip loot first. For 2+ players these stacks are fixed;
 // for a solo run, split Airstrip loot is allowed.
 const airWhole=best.parts.filter(p=>p.phase==='airstrip');
 for(const p of airWhole){
   let candidates=out
     .map((b,i)=>({b,i,room:100-b.used}))
     .filter(x=>x.room+0.001>=p.space)
     .sort((a,b)=>a.room-b.room);
   if(candidates.length){
     const b=candidates[0].b;
     b.items.push({t:p.t,space:p.space,phase:'airstrip'});
     b.used+=p.space;
   }
 }

 // Compound loot fills whatever capacity remains. Only Compound split loot
 // may be fractional; Paintings remain whole stacks.
 const compoundWhole=best.parts.filter(p=>p.phase==='compound'&&!p.t.split).sort((a,b)=>b.space-a.space);
 const compoundSplit=best.parts.filter(p=>p.phase==='compound'&&p.t.split).sort((a,b)=>b.space-a.space);

 for(const p of compoundWhole){
   let candidates=out
     .map((b,i)=>({b,i,room:100-b.used}))
     .filter(x=>x.room+0.001>=p.space)
     .sort((a,b)=>a.room-b.room);
   if(candidates.length){
     const b=candidates[0].b;
     b.items.push({t:p.t,space:p.space,phase:'compound'});
     b.used+=p.space;
   }
 }

 for(const p of compoundSplit){
   let rem=p.space;
   for(const b of out){
     if(rem<=0.001)break;
     const take=Math.min(100-b.used,rem);
     if(take>0){
       b.items.push({t:p.t,space:take,phase:'compound'});
       b.used+=take;
       rem-=take;
     }
   }
 }

 // Combine identical loot within each bag, but never combine across bags.
 out.forEach(b=>{
   const map=new Map();
   b.items.forEach(it=>{
     const k=it.t.k;
     if(!map.has(k))map.set(k,{t:it.t,space:0,phases:[]});
     map.get(k).space+=it.space;
     if(it.phase && !map.get(k).phases.includes(it.phase))map.get(k).phases.push(it.phase);
   });
   b.items=[...map.values()].sort((a,b)=>b.space-a.space);
 });

 let html='<div class="section">🏆 BEST LOOT DISTRIBUTION</div>';
 html+='<div class="note" style="margin-top:0">Optimized for the highest-value secondary loot while respecting your player count and route. '+(bags===1?'Solo runs use Airstrip loot only; Airstrip split loot may be taken fractionally.':(useAirstrip?'Compound loot is prioritized; Airstrip loot is used only when the Compound cannot fill all bags.':'Compound loot is sufficient to fill all bags, so Airstrip loot is ignored. Airstrip stacks stay whole with 2+ players.'))+' Compound Gold and Cash may be split.</div>';
 html+='<div class="bags" style="margin-top:12px">';

 out.forEach((b,i)=>{
   html+='<div class="bag"><div class="bagtop"><span>🎒 BAG '+(i+1)+'</span><span>'+b.used.toFixed(1)+'%</span></div>';
   html+='<div class="bar"><div class="fill" style="width:'+Math.min(100,b.used)+'%"></div></div>';
   b.items.forEach(it=>{
     const countText = (!it.t.split && Math.abs((it.space / it.t.space)-Math.round(it.space / it.t.space))<0.01 && Math.round(it.space / it.t.space)>1)
       ? ' × '+Math.round(it.space / it.t.space)
       : '';
     html+='<div class="item"><span>'+it.t.e+' '+it.t.n+countText+'</span><strong>'+it.space.toFixed(1)+'%</strong></div>';
   });
   html+='</div>';
 });
 html+='</div><div class="note"><b>Loot rules:</b> '+(bags===1?'Solo runs use Airstrip loot only; Airstrip split loot may be taken fractionally.':(useAirstrip?'With 2+ players, Compound loot is used first and Airstrip loot fills any remaining capacity; Airstrip stacks are whole-only.':'With 2+ players, Compound loot is used exclusively when it can fill all bags; Airstrip loot is ignored.'))+' Compound paintings are whole 50% stacks; Compound Gold and Cash may be taken partially.</div>';
 document.getElementById('result').innerHTML=html;
}
/* ===== ISOLATED MISSION BRIEFING LOGIC ===== */
function briefingLootByLocation(loc){
  const found=[];
  LOCATION_TYPES.forEach(k=>{
    const t=TYPES.find(x=>x.k===k);
    (locationAssignments[k]||[]).forEach((assigned,i)=>{
      if(assigned===loc) found.push(t.e+' '+t.n);
    });
  });
  return found;
}
function briefingZoneHtml(title, locations){
  let h='<div class="briefingCard"><div class="briefingZoneTitle">'+title+'</div>';
  locations.forEach(loc=>{
    const loot=briefingLootByLocation(loc);
    h+='<div class="briefingLoc">'+loc;
    if(loot.length) h+='<span class="briefingLocLoot">'+loot.join(' • ')+'</span>';
    else h+='<span class="briefingLocLoot" style="opacity:.35">EMPTY</span>';
    h+='</div>';
  });
  return h+'</div>';
}
function briefingBagsHtml(){
  const result=document.getElementById('result');
  const bagEls=result?result.querySelectorAll('.bag'):[];
  if(!bagEls.length)return '<div class="briefingCard"><div class="briefingSub">Optimize your loot first.</div></div>';
  let h='<div class="briefingBagGrid">';
  bagEls.forEach((bag,i)=>{
    const top=bag.querySelector('.bagtop');
    const spans=top?top.querySelectorAll('span'):[];
    const used=spans.length>1?spans[1].textContent.trim():'';
    h+='<div class="briefingBag"><div class="briefingBagHead"><span class="briefingBagName">BAG '+(i+1)+'</span><span class="briefingBagPct">'+used+'</span></div>';
    bag.querySelectorAll('.item').forEach(item=>{
      const text=item.querySelector('span')?.textContent?.trim()||'';
      const pct=item.querySelector('strong')?.textContent?.trim()||'';
      if(text) h+='<div class="briefingBagItem"><span>'+text+'</span><strong>'+pct+'</strong></div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}

  const bagEls=result?result.querySelectorAll('.bag'):[];
  if(!bagEls.length){alert('Optimize your loot first, then create the mission briefing.');return;}
  const appBanner=document.querySelector('.banner.bannerImage img');
  const page=document.getElementById('briefingPage');
  const bannerSrc=appBanner?appBanner.getAttribute('src'):'';
  page.innerHTML='';
  const img=document.createElement('img');
  img.className='briefingBanner';
  img.src=bannerSrc;
  img.alt='Cayo Calc — Why So Legal? Edition';
  page.appendChild(img);
  const body=document.createElement('div');body.className='briefingBody';
  body.innerHTML='<div class="briefingStampRow"><span class="briefingStamp">CLASSIFIED</span><span class="briefingStamp">OPERATIONAL BRIEFING</span></div>'+
    '<div class="briefingCard"><div class="briefingKicker">MISSION STATUS</div><div class="briefingStatus">SECONDARY LOOT PLAN LOCKED</div><div class="briefingSub">'+bags+' BAG'+(bags===1?'':'S')+' • OPTIMIZED FOR MAXIMUM SECONDARY LOOT</div><div class="briefingDateTime">MISSION DATE • '+new Date().toLocaleDateString('en-ZA',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+' &nbsp; | &nbsp; TIME • '+new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',hour12:false})+'</div></div>'+
    '<div class="briefingKicker" style="margin-top:18px">LOOT LOCATIONS</div>'+
    '<div class="briefingZoneGrid">'+briefingZoneHtml('🏝️ MAIN COMPOUND',MAIN_LOCATIONS)+briefingZoneHtml('🛩️ AIRSTRIP',AIRSTRIP_LOCATIONS)+'</div>'+
    '<div class="briefingKicker" style="margin-top:18px">BEST LOOT DISTRIBUTION</div>'+briefingBagsHtml()+
    '<div class="briefingFooter">GENERATED BY CAYO CALC • WHY SO LEGAL?<br>CLASSIFIED — FOR CREW USE ONLY</div>';
  page.appendChild(body);
  document.getElementById('briefingOverlay').classList.add('show');
  document.getElementById('briefingOverlay').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
async function toggleBriefingFullscreen(){
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
      return;
    }
    const target=document.documentElement;
    if(target.requestFullscreen) await target.requestFullscreen();
  }catch(err){
    console.warn('Fullscreen unavailable:',err);
  }
}
function closeBriefing(){
  if(document.fullscreenElement){
    try{document.exitFullscreen();}catch(err){}
  }
  document.getElementById('briefingOverlay').classList.remove('show');
  document.getElementById('briefingOverlay').setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
function syncBriefingFullscreenButton(){
  const btn=document.querySelector('.briefingFullscreen');
  if(!btn)return;
  const fs=!!document.fullscreenElement;
  btn.textContent=fs?'⛶':'⛶';
  btn.setAttribute('aria-label',fs?'Exit full screen':'Full screen briefing');
  btn.title=fs?'Exit full screen':'Full screen';
}
document.addEventListener('fullscreenchange',syncBriefingFullscreenButton);
function syncBriefingLauncher(){
  const btn=document.getElementById('briefingLaunch');
  const ready=!!document.querySelector('#result .bag');
  if(btn){ btn.classList.toggle('ready',ready); }
}
const briefingObserver=new MutationObserver(syncBriefingLauncher);
function initBriefingObserver(){
  const r=document.getElementById('result');
  if(r){briefingObserver.observe(r,{childList:true,subtree:true});syncBriefingLauncher();}
}

initLootPickerEvents();
const restored=loadState();
renderCuts();
renderLocations();
if(restored)saveState();
initBriefingObserver();
